<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
     <nav>
        <h1>LunchFind</h1>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="favourite.html"><img src="/image/heart5.png" alt="nav-favourite-icon"> Favourites</a></li>
        </ul>
        <button class="sidebar-toggleOn"><img src="/image/hamburger (1).png" alt="hamburger-icon"></button>
    </nav>
<div class="overlay hidden"></div>
<main>
    <header>
        <section>
            <div></div>
            <h2>What are we eating tonight?</h2>
            <p>Pick a category for ideas or search for something specific</p>
        </section>
    </header>

    <section class="category-select-carousel">
        <section class="category-select">
            <button class="category-btn active-category">Breakfast</button>
            <button class="category-btn">Vegetarian</button>
            <button class="category-btn">Dessert</button>
            <button class="category-btn">Seafood</button>
            <button class="category-btn">Starter</button>
            <button class="category-btn">Vegan</button>
        </section>

       <div class="carousel-container">
        <button class="previous">&larr;</button>
        <div class="carousel-track">

        </div>
        <button class="next">&rarr;</button>
       </div>
    </section>

    <section class="recipe-search">
       <h2>Search all recipes</h2>
       <input class="recipe-search-input" placeholder="search">
       <section class="recipes-container">
       </section>  
    </section>
</main>
<section class="recipe-modal hidden">
  
</section>

<aside class="sidebar">
    <section>
        <h4>LunchFind</h4>
        <button class="sidebar-close-btn"><img src="/image/close (4).png" alt="close-icon"></button>
    </section>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="favourite.html"><img src="/image/heart.png"> Favourites</a></li>
    </ul>
</aside>
    <script type="module" src="/Controllers/script.js"></script>
</body>
</html>
